name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Unit tests
        run: gradle --no-daemon :app:testReleaseUnitTest

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk HerdMentality.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HerdMentality-apk
          path: HerdMentality.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Стадо v1.0.${{ github.run_number }}
          body: |
            Збірка з коміту ${{ github.sha }}.
            Завантаж HerdMentality.apk на телефон хоста й встанови поверх попередньої версії.
          files: HerdMentality.apk
          make_latest: true
